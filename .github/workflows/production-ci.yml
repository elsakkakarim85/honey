name: ApisLM Production CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        cd ApisLM_Local_Backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest httpx
    - name: Run PyTest Security & Route Tests
      run: |
        cd ApisLM_Local_Backend
        pytest tests/

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: "20.x"
    - name: Install and Test Mobile Edge
      run: |
        cd ApisLM_Mobile_Edge
        npm ci
        npm test
    - name: Build Cloud Dashboard
      run: |
        cd ApisLM_Workspace/cloud-tenant-dashboard
        npm ci
        npm run build

  docker-build-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build & Push Backend
      run: |
        docker build -t apislm/gateway:latest ./ApisLM_Local_Backend
        docker push apislm/gateway:latest
    - name: Build & Push Dashboard
      run: |
        docker build -t apislm/dashboard:latest ./ApisLM_Workspace/cloud-tenant-dashboard
        docker push apislm/dashboard:latest
