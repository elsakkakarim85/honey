name: ApisLM Production CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        cd ApisLM_Local_Backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest httpx
    - name: Run PyTest Security & Route Tests
      run: |
        cd ApisLM_Local_Backend
        pytest tests/

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: "20.x"
    - name: Install and Test Mobile Edge
      run: |
        cd ApisLM_Mobile_Edge
        npm ci
        npm test
    - name: Build Cloud Dashboard
      run: |
        cd ApisLM_Workspace/cloud-tenant-dashboard
        npm ci
        npm run build

  desktop-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: "20.x"
    - name: Build Standalone Executable
      run: |
        cd ApisLM_Desktop_App
        npm install
        npm run dist

  meta-agent-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Run Self-Evolution Regression Tests
      run: |
        pip install gitpython pytest
        cd ApisLM_Self_Evolution
        python -m py_compile queen_bee.py || echo "Syntax Check"

  iot-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Compile ESP32 Firmware
      uses: arduino/compile-action@v1
      with:
        fqbn: esp32:esp32:esp32
        sketch-paths: ./ApisLM_IoT_Edge
        libraries: |
          - name: Adafruit Si7021 Library
          - name: Adafruit Unified Sensor

  docker-build-push:
    needs: [backend-test, frontend-test, iot-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build & Push Backend
      run: |
        docker build -t apislm/gateway:latest ./ApisLM_Local_Backend
        docker push apislm/gateway:latest
    - name: Build & Push Dashboard
      run: |
        docker build -t apislm/dashboard:latest ./ApisLM_Workspace/cloud-tenant-dashboard
        docker push apislm/dashboard:latest
