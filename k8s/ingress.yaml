apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apislm-ingress
  namespace: apislm-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - apislm.com
    - api.apislm.com
    secretName: apislm-tls-cert
  rules:
  - host: apislm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 3000
  - host: api.apislm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8000
