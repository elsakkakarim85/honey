apiVersion: apps/v1
kind: Deployment
metadata:
  name: apislm-gateway
  namespace: apislm-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: apislm/gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: apislm-secrets
              key: jwt-secret
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apislm-production
spec:
  ports:
  - port: 8000
  selector:
    app: gateway
